name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q bluepunk_ready_to_build.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assemblePrereleaseDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bluepunk-apk
          path: project/app/build/outputs/apk/prerelease/debug/*.apk

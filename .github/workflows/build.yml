name: Build My Custom APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Source Code
        run: |
          mkdir source
          unzip -q DOC-20261113-WA0073.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew assemblePrereleaseDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Custom-APK
          path: source/app/build/outputs/apk/prerelease/debug/*.apk

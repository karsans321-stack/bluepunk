name: Build Bluepunk APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Bluepunk
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Bluepunk Source
        run: |
          set -e
          mkdir -p source
          unzip -q bluepunk_ready_to_build.zip -d source

          if [ ! -f source/gradlew ]; then
            echo "ERROR: gradlew not found in source root"
            find source -maxdepth 3 -name gradlew
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Bluepunk APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew assemblePrereleaseDebug --no-daemon

      - name: Upload Bluepunk APK
        uses: actions/upload-artifact@v4
        with:
          name: Bluepunk-APK
          path: source/app/build/outputs/apk/prerelease/debug/*.apk
          if-no-files-found: error
          retention-days: 14
